name: Build WorldBridge APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack WorldBridge source archive
        run: |
          archive="$(find . -maxdepth 1 -type f -name 'WorldBridgeAndroid-preview-source*.zip' | head -n 1)"
          if [ -n "$archive" ]; then
            echo "Using source archive: $archive"
            unzip -oq "$archive" -d .
          fi
          test -f settings.gradle.kts || { echo "WorldBridge source is missing. Upload the contents of WorldBridgeAndroid-preview-source.zip to the repository root, or upload the extracted project files."; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldBridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
