name: Build WorldBridge APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack WorldBridge source archive
        run: |
          archive="$(find . -maxdepth 1 -type f -name 'WorldBridgeAndroid-preview-source*.zip' | head -n 1)"
          if [ -n "$archive" ]; then
            echo "Using source archive: $archive"
            mkdir -p /tmp/worldbridge-source
            unzip -oq "$archive" -d /tmp/worldbridge-source
            project_root="$(find /tmp/worldbridge-source -type f -name 'settings.gradle.kts' -print -quit | xargs -r dirname)"
            if [ -z "$project_root" ]; then
              echo "Could not find settings.gradle.kts inside the source archive."
              exit 1
            fi
            cp -a "$project_root"/. .
          fi
          test -f settings.gradle.kts || { echo "WorldBridge source is missing. Upload the source archive or extracted project files."; exit 1; }
          # Fix a Java Android API typo in the uploaded source archive.
          sed -i "s/setTextAllCaps(/setAllCaps(/g" app/src/main/java/com/worldbridge/app/MainActivity.java
          # Install the block-resolution map renderer and saved-player marker.
          # The source patch is split into small text fragments to keep GitHub API commits reliable.
          cat renderer_patch.part1.b64 renderer_patch.part2.b64 renderer_patch.part3.b64 renderer_patch.part4.b64 renderer_patch.part5.b64 renderer_patch.part6.b64 > /tmp/renderer_patch.b64
          test "$(wc -c < /tmp/renderer_patch.b64)" -eq 18140
          base64 -d /tmp/renderer_patch.b64 > /tmp/worldbridge-renderer-patch.zip
          unzip -tq /tmp/worldbridge-renderer-patch.zip
          unzip -oq /tmp/worldbridge-renderer-patch.zip -d .
          # Re-enable real subchunk sampling with palette lookup cached once per palette.
          # Draw a checkerboard for missing chunks and add chunk coordinate labels at close zoom.
          python3 scripts/optimize_preview.py
          # Cache each visible chunk as a small bitmap; draw only the viewport and cap memory use.
          python3 scripts/optimize_view.py
          sed -i 's/versionCode = 2/versionCode = 6/' app/build.gradle.kts
          sed -i 's/versionName = "0.2.0"/versionName = "0.4.1"/' app/build.gradle.kts
          # iq80 LevelDB uses Guava ThreadFactoryBuilder at runtime; package it explicitly.
          sed -i '/^dependencies {/a\    implementation("com.google.guava:guava:33.4.8-android")' app/build.gradle.kts

      - name: Upload unpacked source for review
        uses: actions/upload-artifact@v4
        with:
          name: WorldBridge-source-snapshot
          path: |
            app/src/main/java/**/*.java
            engine/src/main/java/**/*.java
            app/build.gradle.kts
            engine/build.gradle.kts
            build.gradle.kts
            settings.gradle.kts
          if-no-files-found: error

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
          sed -i "s/compileSdk = 37/compileSdk = 36/" app/build.gradle.kts
          sed -i 's/version "9.6.0"/version "9.5.1"/' build.gradle.kts

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldBridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
