name: Build Chunkly APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Android source and apply Chunkly release polish
        run: |
          archive="$(find . -maxdepth 1 -type f -name 'WorldBridgeAndroid-preview-source*.zip' | head -n 1)"
          if [ -n "$archive" ]; then
            echo "Using source archive: $archive"
            mkdir -p /tmp/worldbridge-source
            unzip -oq "$archive" -d /tmp/worldbridge-source
            project_root="$(find /tmp/worldbridge-source -type f -name 'settings.gradle.kts' -print -quit | xargs -r dirname)"
            if [ -z "$project_root" ]; then
              echo "Could not find settings.gradle.kts inside the source archive."
              exit 1
            fi
            cp -a "$project_root"/. .
          fi
          test -f settings.gradle.kts || { echo "Chunkly Android source is missing. Check the source archive."; exit 1; }
          sed -i "s/setTextAllCaps(/setAllCaps(/g" app/src/main/java/com/worldbridge/app/MainActivity.java
          cat renderer_patch.part1.b64 renderer_patch.part2.b64 renderer_patch.part3.b64 renderer_patch.part4.b64 renderer_patch.part5.b64 renderer_patch.part6.b64 > /tmp/renderer_patch.b64
          test "$(wc -c < /tmp/renderer_patch.b64)" -eq 18140
          base64 -d /tmp/renderer_patch.b64 > /tmp/worldbridge-renderer-patch.zip
          unzip -tq /tmp/worldbridge-renderer-patch.zip
          unzip -oq /tmp/worldbridge-renderer-patch.zip -d .
          python3 scripts/optimize_preview.py
          python3 scripts/optimize_dimensions.py
          python3 scripts/optimize_view.py
          python3 scripts/optimize_view_v2.py
          python3 scripts/optimize_preview_pipeline.py
          python3 scripts/optimize_fast_preview_scan.py
          python3 scripts/redesign_ui.py
          python3 scripts/refine_streak_style.py
          python3 scripts/segmented_dimensions.py
          python3 scripts/fix_dimension_selection.py
          python3 scripts/fix_dimension_tabs_v2.py
          python3 scripts/prune_saved_data.py
          python3 scripts/add_minimal_icon.py
          python3 scripts/professional_ui_copy.py
          python3 scripts/consistent_section_headings.py
          python3 scripts/remove_bottom_navigation.py
          python3 scripts/add_delete_world_button.py
          python3 scripts/theme_confirmation_dialogs.py
          python3 scripts/end_dimension_central_island.py
          python3 scripts/fix_mycelium_preview_color.py
          # Give red and brown mushroom blocks their own surface colours in the map preview.
          python3 scripts/add_mushroom_block_preview_colors.py
          python3 scripts/raise_selected_section_headings.py
          python3 scripts/lower_world_import_content.py
          python3 scripts/chunkly_release_polish.py
          python3 scripts/balanced_target_section_headings.py
          python3 scripts/reduce_world_dimension_top_inset.py
          python3 scripts/align_world_dimension_headings.py
          sed -i -E 's/versionCode = [0-9]+/versionCode = 52/' app/build.gradle.kts
          sed -i -E 's/versionName = "[^"]+"/versionName = "1.0"/' app/build.gradle.kts
          sed -i '/^dependencies {/a\    implementation("com.google.guava:guava:33.4.8-android")' app/build.gradle.kts
          python3 -m py_compile scripts/chunkly_release_polish.py scripts/verify_chunkly_release.py
          python3 scripts/verify_chunkly_release.py

      - name: Upload unpacked source for review
        uses: actions/upload-artifact@v4
        with:
          name: Chunkly-source-snapshot
          path: |
            app/src/main/**
            engine/src/main/**
            scripts/*.py
            app/build.gradle.kts
            engine/build.gradle.kts
            build.gradle.kts
            settings.gradle.kts
          if-no-files-found: error

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
          sed -i "s/compileSdk = 37/compileSdk = 36/" app/build.gradle.kts
          sed -i 's/version "9.6.0"/version "9.5.1"/' build.gradle.kts

      - name: Build debug QA APK and unsigned release APK
        run: gradle --no-daemon clean assembleDebug assembleRelease

      - name: Verify APK signatures and compiled package metadata
        run: |
          tools="$ANDROID_HOME/build-tools/36.0.0"
          debug_apk="app/build/outputs/apk/debug/app-debug.apk"
          release_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          "$tools/apksigner" verify --verbose "$debug_apk"
          debug_badging="$("$tools/aapt" dump badging "$debug_apk")"
          release_badging="$("$tools/aapt" dump badging "$release_apk")"
          grep -F "package: name='com.worldbridge.app' versionCode='52' versionName='1.0'" <<< "$debug_badging"
          grep -F "application-label:'Chunkly'" <<< "$debug_badging"
          grep -F "package: name='com.worldbridge.app' versionCode='52' versionName='1.0'" <<< "$release_badging"
          grep -F "application-label:'Chunkly'" <<< "$release_badging"
          if "$tools/apksigner" verify "$release_apk"; then
            echo "Release candidate unexpectedly contains a signature; check the signing configuration."
            exit 1
          else
            echo "Release candidate is unsigned as intended; publisher signing is still required."
          fi

      - name: Upload debug QA APK
        uses: actions/upload-artifact@v4
        with:
          name: Chunkly-1.0-debug-qa
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Chunkly-1.0-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
